name: past_partner
description: Personalised companion mobile client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # file_picker 8.x targets API 34; keep its lifecycle helper on the
  # compatible release instead of resolving the API-36-only latest version.
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
