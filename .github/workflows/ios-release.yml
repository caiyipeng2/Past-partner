name: iOS Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Validate iOS release policy
        run: python scripts/check_ios_release.py --project-root .

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned iOS archive package
        if: ${{ runner.os == 'macOS' }}
        run: flutter build ipa --release --no-codesign
